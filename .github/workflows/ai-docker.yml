name: AI Service Docker Build

# Verify that the image builds and runs as a non-root user.
#
# Deliberately NOT done here:
#   - no push to any registry (push: false, no login, no credentials)
#   - no deployment of any kind
#   - no AI provider call
#
# The image is loaded into the runner's local daemon, inspected, then discarded
# with the runner.

on:
  push:
    branches:
      - main
      - development
      - "feature/**"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "app/**"
      - "scripts/**"
      - ".github/workflows/ai-docker.yml"
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: arthiq-ai
  IMAGE_TAG: ci

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect the built image
        run: |
          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format 'id={{.Id}} size={{.Size}} user={{.Config.User}}'

      - name: Verify the image runs as a non-root user
        run: |
          user=$(docker run --rm --entrypoint id "${IMAGE_NAME}:${IMAGE_TAG}" -un)
          echo "container user: ${user}"
          [ "${user}" != "root" ] || { echo "::error::image runs as root"; exit 1; }

      - name: Verify the image contents
        # Proves the build produced a usable image. Starts no server, opens no
        # port, and calls no AI provider.
        run: |
          docker run --rm --entrypoint python "${IMAGE_NAME}:${IMAGE_TAG}" \
            -c "import app; from app.main import create_app; print('app', app.__version__)"

      - name: Verify the health endpoint
        # Health must answer without a provider, a key or a model configured.
        run: |
          docker run -d --name ai-ci -p 8100:8100 "${IMAGE_NAME}:${IMAGE_TAG}"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8100/health; then ready=1; break; fi
            sleep 1
          done
          docker logs ai-ci
          docker rm -f ai-ci
          [ "${ready:-0}" = "1" ] || { echo "::error::health never became ready"; exit 1; }

      - name: Verify no Ollama is baked into the image
        run: |
          if docker run --rm --entrypoint sh "${IMAGE_NAME}:${IMAGE_TAG}" -c "command -v ollama"; then
            echo "::error::the production image contains Ollama"
            exit 1
          fi
          echo "No Ollama in the image, as intended."

      - name: Validate the Compose file
        run: docker compose --env-file .env.example config --quiet

      - name: Confirm the image was not published
        run: |
          echo "Build-only workflow - no registry login, no push, no deploy."
